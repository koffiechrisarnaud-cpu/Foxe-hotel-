<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Foxe Hôtel – Connexion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5f1ea;--card:#fffdf9;--ink:#2a2118;--muted:#6f655a;--olive:#4b4a24;--gold:#c08a3e;--line:#e2dccf;--err:#b3412f;--ok:#3f6b3a;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#17120d;--card:#221b14;--ink:#f1eadf;--muted:#b3a899;--olive:#8a8847;--line:#352c22;--err:#e07a66;--ok:#8fc287}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1.1}
.top{margin:12px;border-radius:28px;color:#fff;padding:20px 22px 30px;background:linear-gradient(180deg,rgba(20,14,8,.15),rgba(20,14,8,.7)),radial-gradient(circle at 70% 20%,#7a8a4a 0,#3d4a26 45%,#1f1710 100%)}
.logo{font:600 24px "Cormorant Garamond",Georgia,serif}
.top h1{font-size:clamp(36px,10vw,52px);margin-top:34px}.top p{opacity:.85;margin-top:8px;font-size:14px}
.box{max-width:460px;margin:-18px auto 30px;padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:99px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:none;color:var(--muted);padding:11px;border-radius:99px;font:500 14px "DM Sans",system-ui,sans-serif;cursor:pointer}
.tabs button.on{background:var(--olive);color:#fff}
.f{display:none}.f.on{display:block}
.field{margin-bottom:13px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.inp{position:relative}
input{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px "DM Sans",system-ui,sans-serif}
.inp input{padding-right:48px}
input:focus{outline:2px solid var(--olive);outline-offset:1px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);padding:9px;cursor:pointer;display:flex;line-height:0}
.err{color:var(--err);font-size:12px;min-height:16px;margin-top:3px}
.btn{width:100%;background:var(--olive);color:#fff;border:0;border-radius:99px;padding:14px;font:500 16px "DM Sans",system-ui,sans-serif;cursor:pointer;margin-top:6px}
.btn:disabled{opacity:.55}
.btn.o{background:none;color:var(--olive);border:1.5px solid var(--olive)}
.link{display:block;text-align:right;font-size:13px;color:var(--gold);text-decoration:none;margin:-4px 0 6px}
#note{display:none;margin-top:14px;padding:12px;border-radius:14px;background:var(--bg);font-size:13px}
#note.good{border:1px dashed var(--ok);color:var(--ok)}#note.bad{border:1px dashed var(--err);color:var(--err)}
.av{width:60px;height:60px;border-radius:50%;background:var(--olive);color:#fff;display:grid;place-items:center;font:600 28px "Cormorant Garamond",Georgia,serif;margin:0 auto 10px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;border:1px solid currentColor;margin-top:8px}
.badge.adm{color:var(--gold)}.badge.cli{color:var(--ok)}
.c{text-align:center}
</style>
</head>
<body>
<header class="top"><div class="logo">Foxe Hôtel</div><h1>Bienvenue</h1><p>Connectez-vous pour réserver et retrouver vos séjours.</p></header>

<main class="box"><div class="card">

  <div id="vAuth">
    <div class="tabs"><button id="t1" class="on" type="button">Connexion</button><button id="t2" type="button">Inscription</button></div>

    <form id="login" class="f on" novalidate>
      <div class="field"><label for="le">E-mail</label><input id="le" type="email" autocomplete="email" placeholder="vous@exemple.com"><div class="err"></div></div>
      <div class="field"><label for="lp">Mot de passe</label><div class="inp"><input id="lp" type="password" autocomplete="current-password"><button type="button" class="eye"></button></div><div class="err"></div></div>
      <a class="link" href="#" id="forgot">Mot de passe oublié ?</a>
      <button class="btn" id="lb" type="submit">Se connecter</button>
    </form>

    <form id="signup" class="f" novalidate>
      <div class="field"><label for="sn">Nom complet</label><input id="sn" autocomplete="name" placeholder="Prénom Nom"><div class="err"></div></div>
      <div class="field"><label for="st">Téléphone</label><input id="st" type="tel" autocomplete="tel" placeholder="+225 07 00 00 00 00"><div class="err"></div></div>
      <div class="field"><label for="se">E-mail</label><input id="se" type="email" autocomplete="email" placeholder="vous@exemple.com"><div class="err"></div></div>
      <div class="field"><label for="sp">Mot de passe (8 caractères minimum)</label><div class="inp"><input id="sp" type="password" autocomplete="new-password"><button type="button" class="eye"></button></div><div class="err"></div></div>
      <div class="field"><label for="sc">Confirmer le mot de passe</label><input id="sc" type="password" autocomplete="new-password"><div class="err"></div></div>
      <button class="btn" id="sb" type="submit">Créer mon compte</button>
    </form>
  </div>

  <div id="vIn" class="c" style="display:none">
    <div class="av" id="av"></div>
    <h2 id="who" style="font-size:30px"></h2>
    <div style="color:var(--muted);font-size:14px" id="em"></div>
    <span class="badge" id="rl"></span>
    <p style="color:var(--muted);font-size:13px;margin:16px 0 8px">Vous êtes connecté.</p>
    <a class="btn" href="compte.html" style="display:block;text-decoration:none;margin-top:0">Mes réservations</a>
    <a class="btn o" href="index.html" style="display:block;text-decoration:none;margin-top:8px">Retour à l'accueil</a>
    <button class="btn o" id="out" type="button" style="margin-top:8px;border-color:var(--err);color:var(--err)">Se déconnecter</button>
  </div>

  <form id="vNew" style="display:none" novalidate>
    <h2 style="font-size:28px;margin-bottom:10px">Nouveau mot de passe</h2>
    <div class="field"><label for="np">Nouveau mot de passe (8 caractères minimum)</label><input id="np" type="password" autocomplete="new-password"><div class="err"></div></div>
    <button class="btn" type="submit">Enregistrer</button>
  </form>

  <div id="note"></div>
</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var C=window.FOXE||{};
var mail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
var recovery=false;
var EYE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYEOFF='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';

if(!window.supabase||!C.SUPABASE_URL){
  document.body.innerHTML='<p style="padding:30px;font-family:system-ui">Le site ne peut pas se connecter à la base de données. Vérifiez que le fichier config.js existe et rechargez la page.</p>';
  throw new Error("config manquante");
}
var db=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY);

function show(t,ok){var n=$("note");n.textContent=t;n.className=ok?"good":"bad";n.style.display="block"}
function hideNote(){$("note").style.display="none"}
function view(v){["vAuth","vIn","vNew"].forEach(function(x){$(x).style.display=x==v?"block":"none"});hideNote()}
function tab(n){
  $("t1").classList.toggle("on",n==1);$("t2").classList.toggle("on",n==2);
  $("login").classList.toggle("on",n==1);$("signup").classList.toggle("on",n==2);hideNote();
}
function bad(id,m){var b=$(id).closest(".field");b.querySelector(".err").textContent=m||"";return !m}
function busy(id,on,label){var b=$(id);b.disabled=on;if(on){b.dataset.t=b.textContent;b.textContent="Un instant…"}else b.textContent=b.dataset.t||label}
function frErr(e){
  var m=(e&&e.message)||"";
  if(/invalid login/i.test(m))return "E-mail ou mot de passe incorrect.";
  if(/not confirmed/i.test(m))return "Confirmez d'abord votre e-mail avec le lien que nous vous avons envoyé.";
  if(/rate limit|too many|security purposes/i.test(m))return "Trop de tentatives ou d'e-mails envoyés. Patientez quelques minutes puis réessayez.";
  if(/already registered/i.test(m))return "Un compte existe déjà avec cet e-mail. Connectez-vous.";
  if(/password/i.test(m))return "Mot de passe refusé : utilisez 8 caractères minimum.";
  return "Une erreur est survenue : "+m;
}

$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
document.querySelectorAll(".eye").forEach(function(b){
  b.innerHTML=EYE;b.setAttribute("aria-label","Afficher le mot de passe");
  b.onclick=function(){
    var i=b.previousElementSibling,s=i.type=="password";
    i.type=s?"text":"password";b.innerHTML=s?EYEOFF:EYE;
  };
});

async function enter(){
  if(recovery)return;
  var g=await db.auth.getUser();
  var u=g.data&&g.data.user;
  if(!u){view("vAuth");return}
  var p=await db.from("profiles").select("full_name,phone,role").eq("id",u.id).maybeSingle();
  var prof=p.data||{},meta=u.user_metadata||{};
  if(!prof.phone&&meta.phone){await db.from("profiles").update({phone:meta.phone}).eq("id",u.id)}
  var name=prof.full_name||meta.full_name||u.email;
  $("who").textContent=name;$("av").textContent=name.charAt(0).toUpperCase();
  $("em").textContent=u.email;
  var adm=prof.role=="admin";
  $("rl").textContent=adm?"Administrateur":"Client";$("rl").className="badge "+(adm?"adm":"cli");
  if(!recovery)view("vIn");
}

$("login").onsubmit=async function(e){
  e.preventDefault();
  var a=bad("le",mail.test($("le").value.trim())?"":"Entrez un e-mail valide.");
  var b=bad("lp",$("lp").value.length>=8?"":"8 caractères minimum.");
  if(!(a&&b))return;
  busy("lb",true);
  var r=await db.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value});
  busy("lb",false,"Se connecter");
  if(r.error){show(frErr(r.error),false);return}
  await enter();
};

$("signup").onsubmit=async function(e){
  e.preventDefault();
  var email=$("se").value.trim();
  var ok=[
    bad("sn",$("sn").value.trim().length>=3?"":"Entrez votre nom complet."),
    bad("st",$("st").value.replace(/\D/g,"").length>=8?"":"Entrez un numéro valide."),
    bad("se",mail.test(email)?"":"Entrez un e-mail valide."),
    bad("sp",$("sp").value.length>=8?"":"8 caractères minimum."),
    bad("sc",$("sc").value===$("sp").value&&$("sc").value?"":"Les mots de passe ne correspondent pas.")
  ];
  if(!ok.every(Boolean))return;
  busy("sb",true);
  var r=await db.auth.signUp({email:email,password:$("sp").value,options:{
    data:{full_name:$("sn").value.trim(),phone:$("st").value.trim()},
    emailRedirectTo:C.SITE_URL+"connexion.html"}});
  busy("sb",false,"Créer mon compte");
  if(r.error){show(frErr(r.error),false);return}
  if(r.data.user&&r.data.user.identities&&r.data.user.identities.length===0){show("Un compte existe déjà avec cet e-mail. Connectez-vous.",false);return}
  if(r.data.session){await enter();return}
  $("signup").reset();
  show("Compte créé. Nous avons envoyé un lien de confirmation à "+email+". Ouvrez-le pour activer votre compte (pensez à vérifier les spams).",true);
};

$("forgot").onclick=async function(ev){
  ev.preventDefault();
  var m=$("le").value.trim();
  if(!mail.test(m)){show("Entrez d'abord votre e-mail dans le champ ci-dessus.",false);return}
  var r=await db.auth.resetPasswordForEmail(m,{redirectTo:C.SITE_URL+"connexion.html"});
  if(r.error)show(frErr(r.error),false);else show("Si un compte existe avec cet e-mail, un lien de réinitialisation vient d'être envoyé.",true);
};

$("vNew").onsubmit=async function(e){
  e.preventDefault();
  if(!bad("np",$("np").value.length>=8?"":"8 caractères minimum."))return;
  var r=await db.auth.updateUser({password:$("np").value});
  if(r.error){show(frErr(r.error),false);return}
  recovery=false;await enter();show("Mot de passe modifié.",true);
};

$("out").onclick=async function(){
  await db.auth.signOut();view("vAuth");tab(1);show("Vous êtes déconnecté.",true);
};

db.auth.onAuthStateChange(function(ev){
  if(ev=="PASSWORD_RECOVERY"){recovery=true;view("vNew")}
});
db.auth.getSession().then(function(r){if(r.data&&r.data.session)enter()});
</script>
</body>
</html>
