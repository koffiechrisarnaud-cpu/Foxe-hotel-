<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Foxe Hôtel – Test de connexion</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#f5f1ea;color:#2a2118;line-height:1.5}
  .w{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  h1{font-family:Georgia,serif;font-weight:500;font-size:32px;margin:6px 0 4px}
  .sub{color:#6f655a;font-size:14px;margin-bottom:16px}
  .c{background:#fffdf9;border:1px solid #e2dccf;border-radius:18px;padding:14px 16px;margin-top:12px}
  .c b{display:block}
  .ok{color:#3f6b3a}.ko{color:#b3412f}.w8{color:#9a6a1c}
  ul{margin:8px 0 0;padding-left:18px;font-size:14px}
</style>
</head>
<body>
<div class="w">
  <h1>Foxe Hôtel</h1>
  <p class="sub">Test de connexion à la base de données. Cette page vérifie que le site parle bien à Supabase et que la sécurité fonctionne.</p>
  <div id="out"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL = "https://kaqyrpyqdxuvraltngez.supabase.co";
var SUPABASE_KEY = "sb_publishable__du_lUdxOZ-Yc6qS8daY-Q_Gr4AuNFA";

var out = document.getElementById("out");
function line(cls, title, detail){
  var d = document.createElement("div");
  d.className = "c";
  d.innerHTML = '<b class="'+cls+'">'+title+'</b>'+(detail||"");
  out.appendChild(d);
}

(async function(){
  if(!window.supabase){ line("ko","La bibliothèque Supabase n'a pas pu se charger","<div>Vérifiez la connexion internet et rechargez la page.</div>"); return; }
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 1. Chambres : lisibles par tout le monde
  var r = await db.from("rooms").select("name, price_per_night, capacity").order("id");
  if(r.error){
    line("ko","1. Lecture des chambres : échec","<div>"+r.error.message+"</div>");
  }else{
    var li = r.data.map(function(x){return "<li>"+x.name+" — "+Number(x.price_per_night).toLocaleString("fr-FR")+" FCFA, "+x.capacity+" pers.</li>"}).join("");
    line(r.data.length?"ok":"w8","1. Lecture des chambres : "+(r.data.length?"réussie ✓":"aucune chambre trouvée"),"<ul>"+li+"</ul>");
  }

  // 2. Réglages publics (acompte, annulation...)
  var s = await db.from("hotel_settings").select("key, value");
  if(s.error){
    line("ko","2. Lecture des réglages : échec","<div>"+s.error.message+"</div>");
  }else{
    line("ok","2. Lecture des réglages : réussie ✓","<ul>"+s.data.map(function(x){return "<li>"+x.key+" = "+x.value+"</li>"}).join("")+"</ul>");
  }

  // 3. Sécurité : un visiteur ne doit PAS voir ces tables
  var blocked = [["app_settings","l'e-mail du propriétaire"],["bookings","les réservations"],["profiles","les profils clients"],["payments","les paiements"],["messages","les messages"]];
  for(var i=0;i<blocked.length;i++){
    var t = await db.from(blocked[i][0]).select("*").limit(1);
    var name = blocked[i][0], what = blocked[i][1];
    var msg = t.error ? String(t.error.message||"") : "";
    var denied = t.error && (t.error.code==="42501" || /permission denied|row-level security/i.test(msg));
    if(denied || (!t.error && t.data && t.data.length===0)){
      line("ok","3. Sécurité de « "+name+" » : protégée ✓","<div>Un visiteur non connecté ne voit pas "+what+".</div>");
    }else if(t.error){
      line("w8","3. « "+name+" » : test impossible","<div>Le test n'a pas pu se faire ("+msg+"). Ce n'est pas une preuve de sécurité.</div>");
    }else{
      line("ko","3. Sécurité de « "+name+" » : VISIBLE par n'importe qui ✗","<div>Un visiteur ne doit pas voir "+what+".</div>");
    }
  }
})();
</script>
</body>
</html>
